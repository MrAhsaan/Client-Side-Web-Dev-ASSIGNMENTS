}

body {
    margin: clamp(1rem, 3vw, 2rem) auto;
    padding: 0 clamp(.25rem, 1vw, .75rem);
    max-width: 1100px;
    background: #f8fafc;
}
h1, h2, h3, h4 { line-height: 1.25; color: #14213d; }
h1 { margin-block: .5em .75em; }

p { max-width: 78ch; }

a:hover { text-decoration-thickness: 2px; }

}

    width: auto;

}

}

<body>
<h2>Page 2: First 10 Terms of Fibonacci Series</h2>
<label for="fibBox">Fibonacci Series:</label><br/>
<input id="fibBox" readonly="" size="45" type="text"/><br/><br/>
<!-- Back button returns to Page 1 -->
<button id="backToLauncher">Back</button>
<script>
document.getElementById('backToLauncher').addEventListener('click', () => {
    window.location.href = 'Q16_Page1_Fibonacci_Trigger.html';
});
const parameters = new URLSearchParams(window.location.search);
if (parameters.get('show') === 'true') {
    const fibonacci = [0, 1];
    for (let index = 2; index < 10; index += 1) {
        fibonacci.push(fibonacci[index - 1] + fibonacci[index - 2]);
    }
    document.getElementById('fibBox').value = fibonacci.join(', ');
}
</script></body>
