<!DOCTYPE html>
<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Q4 - Student Marksheet by Seat Number</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>/* Shared responsive defaults for a clean, accessible lab submission. */
:root {
    color-scheme: light;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    color: #172033;
    background: #f8fafc;
}
* { box-sizing: border-box; }
body {
    margin: clamp(1rem, 3vw, 2rem) auto;
    padding: 0 clamp(.25rem, 1vw, .75rem);
    max-width: 1100px;
    background: #f8fafc;
}
h1, h2, h3, h4 { line-height: 1.25; color: #14213d; }
h1 { margin-block: .5em .75em; }
h2 { margin-block: .75em; }
p { max-width: 78ch; }
a { color: #1557a6; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
}
table {
    width: auto;
    max-width: 100%;
    margin-block: 1rem;
    border-collapse: collapse;
    background: #fff;
}
th, td {
    padding: .55rem .75rem;
    border: 1px solid #94a3b8;
    vertical-align: middle;
}
th { background: #eaf1fb; font-weight: 650; }
caption { padding: .5rem; font-weight: 650; text-align: left; }
img, video, iframe, canvas { max-width: 100%; }
img { height: auto; }
input, select, textarea, button { max-width: 100%; font: inherit; }
input, select, textarea { padding: .35rem .5rem; }
button, input[type="submit"], input[type="reset"] {
    padding: .4rem .75rem;
    border: 1px solid #64748b;
    border-radius: .35rem;
    background: #eff6ff;
    color: #172033;
    cursor: pointer;
}
button:hover, input[type="submit"]:hover, input[type="reset"]:hover { background: #dbeafe; }
button:disabled { cursor: not-allowed; opacity: .6; }
fieldset { margin-block: .75rem; padding: .8rem; border: 1px solid #94a3b8; border-radius: .4rem; }
legend { padding-inline: .35rem; font-weight: 650; }
.q-box { background: #fff; }
.grid { display: flex; flex-wrap: wrap; gap: 12px; }
.card { border: 1px solid #cbd5e1; border-radius: .5rem; padding: 10px; width: 125px; background: #fff; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
    table { display: block; overflow-x: auto; white-space: nowrap; }
    iframe { width: 100%; }
}</style></head>
<body>
<h2>University Result Portal</h2>
    Enter Seat Number (Try 1001, 1002, or 1003):
    <input id="seatInput" inputmode="numeric" maxlength="4" placeholder="e.g. 1001" type="text"/>
<button id="getResultButton">Get Result</button>
<div id="resultArea" style="margin-top: 15px;"></div>

<script>
// Local sample records used by this exercise.
const studentRecords = {
    '1001': { name: 'Aarav Sharma', web: 88, dbms: 84, os: 90 },
    '1002': { name: 'Ananya Patil', web: 94, dbms: 91, os: 89 },
    '1003': { name: 'Rohan Mehta', web: 76, dbms: 80, os: 79 }
};

document.getElementById('getResultButton').addEventListener('click', () => {
    const seat = document.getElementById('seatInput').value.trim();
    const student = studentRecords[seat];
    const area = document.getElementById('resultArea');
    area.replaceChildren();
    if (!/^\d{4}$/.test(seat) || !student) {
        const message = document.createElement('p');
        message.className = 'error-message';
        message.textContent = 'Invalid Seat Number! Try 1001, 1002, or 1003.';
        message.style.color = '#b91c1c';
        area.append(message);
        return;
    }
    const total = student.web + student.dbms + student.os;
    const table = document.createElement('table');
    const headingRow = table.insertRow();
    const heading = document.createElement('th');
    heading.colSpan = 2;
    heading.textContent = `Marksheet - Seat No: ${seat} (${student.name})`;
    headingRow.append(heading);
    [['Web Technologies', student.web], ['DBMS', student.dbms],
     ['Operating Systems', student.os], ['Total Marks', `${total} / 300`]].forEach(([label, value]) => {
        const row = table.insertRow();
        const nameCell = document.createElement(label === 'Total Marks' ? 'th' : 'td');
        const valueCell = document.createElement(label === 'Total Marks' ? 'th' : 'td');
        nameCell.textContent = label;
        valueCell.textContent = String(value);
        row.append(nameCell, valueCell);
    });
    area.append(table);
});
</script></body>
</html>
