<!DOCTYPE html>
<!DOCTYPE html>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Q17 - Append Selected Numbers (Max 10)</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>/* Shared responsive defaults for a clean, accessible lab submission. */
:root {
    color-scheme: light;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    color: #172033;
    background: #f8fafc;
}
* { box-sizing: border-box; }
body {
    margin: clamp(1rem, 3vw, 2rem) auto;
    padding: 0 clamp(.25rem, 1vw, .75rem);
    max-width: 1100px;
    background: #f8fafc;
}
h1, h2, h3, h4 { line-height: 1.25; color: #14213d; }
h1 { margin-block: .5em .75em; }
h2 { margin-block: .75em; }
p { max-width: 78ch; }
a { color: #1557a6; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
}
table {
    width: auto;
    max-width: 100%;
    margin-block: 1rem;
    border-collapse: collapse;
    background: #fff;
}
th, td {
    padding: .55rem .75rem;
    border: 1px solid #94a3b8;
    vertical-align: middle;
}
th { background: #eaf1fb; font-weight: 650; }
caption { padding: .5rem; font-weight: 650; text-align: left; }
img, video, iframe, canvas { max-width: 100%; }
img { height: auto; }
input, select, textarea, button { max-width: 100%; font: inherit; }
input, select, textarea { padding: .35rem .5rem; }
button, input[type="submit"], input[type="reset"] {
    padding: .4rem .75rem;
    border: 1px solid #64748b;
    border-radius: .35rem;
    background: #eff6ff;
    color: #172033;
    cursor: pointer;
}
button:hover, input[type="submit"]:hover, input[type="reset"]:hover { background: #dbeafe; }
button:disabled { cursor: not-allowed; opacity: .6; }
fieldset { margin-block: .75rem; padding: .8rem; border: 1px solid #94a3b8; border-radius: .4rem; }
legend { padding-inline: .35rem; font-weight: 650; }
.q-box { background: #fff; }
.grid { display: flex; flex-wrap: wrap; gap: 12px; }
.card { border: 1px solid #cbd5e1; border-radius: .5rem; padding: 10px; width: 125px; background: #fff; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
    table { display: block; overflow-x: auto; white-space: nowrap; }
    iframe { width: 100%; }
}</style></head>
<body>
<h2>Append Dropdown Number to Text Box (Max 10 Numbers)</h2>
<select id="numSelect">
<option value="10">10</option>
<option value="20">20</option>
<option value="30">30</option>
<option value="40">40</option>
<option value="50">50</option>
<option value="60">60</option>
<option value="70">70</option>
<option value="80">80</option>
<option value="90">90</option>
<option value="100">100</option>
</select>
<button id="appendNumber">→</button>
<input id="selectedBox" placeholder="Selected numbers appear here..." readonly="" size="45" type="text"/>
<p id="limitMsg" style="color: red;"></p>
<script>
const chosenNumbers = [];
const appendButton = document.getElementById('appendNumber');
const selectionBox = document.getElementById('selectedBox');
const limitMessage = document.getElementById('limitMsg');
appendButton.addEventListener('click', () => {
    if (chosenNumbers.length >= 10) {
        limitMessage.textContent = 'Maximum limit of 10 numbers reached!';
        appendButton.disabled = true;
        return;
    }
    const selectedValue = document.getElementById('numSelect').value;
    if (!/^\d+$/.test(selectedValue)) {
        limitMessage.textContent = 'Please choose a valid number.';
        return;
    }
    chosenNumbers.push(Number(selectedValue));
    selectionBox.value = chosenNumbers.join(', ');
    limitMessage.textContent = `${chosenNumbers.length} of 10 numbers selected.`;
    if (chosenNumbers.length === 10) {
        appendButton.disabled = true;
        limitMessage.textContent = 'Maximum limit of 10 numbers reached!';
    }
});
</script></body>
</html>
