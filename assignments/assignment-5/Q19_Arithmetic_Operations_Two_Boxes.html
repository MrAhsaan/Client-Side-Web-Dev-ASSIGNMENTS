<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Q19 - Arithmetic Operations</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>/* Shared responsive defaults for a clean, accessible lab submission. */
:root {
    color-scheme: light;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    color: #172033;
    background: #f8fafc;
}
* { box-sizing: border-box; }
body {
    margin: clamp(1rem, 3vw, 2rem) auto;
    padding: 0 clamp(.25rem, 1vw, .75rem);
    max-width: 1100px;
    background: #f8fafc;
}
h1, h2, h3, h4 { line-height: 1.25; color: #14213d; }
h1 { margin-block: .5em .75em; }
h2 { margin-block: .75em; }
p { max-width: 78ch; }
a { color: #1557a6; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
}
table {
    width: auto;
    max-width: 100%;
    margin-block: 1rem;
    border-collapse: collapse;
    background: #fff;
}
th, td {
    padding: .55rem .75rem;
    border: 1px solid #94a3b8;
    vertical-align: middle;
}
th { background: #eaf1fb; font-weight: 650; }
caption { padding: .5rem; font-weight: 650; text-align: left; }
img, video, iframe, canvas { max-width: 100%; }
img { height: auto; }
input, select, textarea, button { max-width: 100%; font: inherit; }
input, select, textarea { padding: .35rem .5rem; }
button, input[type="submit"], input[type="reset"] {
    padding: .4rem .75rem;
    border: 1px solid #64748b;
    border-radius: .35rem;
    background: #eff6ff;
    color: #172033;
    cursor: pointer;
}
button:hover, input[type="submit"]:hover, input[type="reset"]:hover { background: #dbeafe; }
button:disabled { cursor: not-allowed; opacity: .6; }
fieldset { margin-block: .75rem; padding: .8rem; border: 1px solid #94a3b8; border-radius: .4rem; }
legend { padding-inline: .35rem; font-weight: 650; }
.q-box { background: #fff; }
.grid { display: flex; flex-wrap: wrap; gap: 12px; }
.card { border: 1px solid #cbd5e1; border-radius: .5rem; padding: 10px; width: 125px; background: #fff; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }

@media (max-width: 640px) {
    table { display: block; overflow-x: auto; white-space: nowrap; }
    iframe { width: 100%; }
}</style></head>
<body>
<h2>Arithmetic Operations on Two Numbers</h2>
    First Number: <input id="op1" step="any" type="number"/><br/><br/>
    Second Number: <input id="op2" step="any" type="number"/><br/><br/>
<button data-operation="add">Addition (+)</button>
<button data-operation="subtract">Subtraction (-)</button>
<button data-operation="multiply">Multiplication (*)</button>
<button data-operation="divide">Division (/)</button>
<h3 id="arithOut"></h3>
<script>
const arithmeticOutput = document.getElementById('arithOut');
function readOperands() {
    const rawA = document.getElementById('op1').value.trim();
    const rawB = document.getElementById('op2').value.trim();
    if (rawA === '' || rawB === '') {
        arithmeticOutput.textContent = 'Please enter both numbers.';
        return null;
    }
    const a = Number(rawA);
    const b = Number(rawB);
    if (!Number.isFinite(a) || !Number.isFinite(b)) {
        arithmeticOutput.textContent = 'Please enter valid finite numbers.';
        return null;
    }
    return [a, b];
}
document.querySelectorAll('button[data-operation]').forEach((button) => {
    button.addEventListener('click', () => {
        const operands = readOperands();
        if (!operands) return;
        const [a, b] = operands;
        switch (button.dataset.operation) {
            case 'add': arithmeticOutput.textContent = `Addition: ${a + b}`; break;
            case 'subtract': arithmeticOutput.textContent = `Subtraction: ${a - b}`; break;
            case 'multiply': arithmeticOutput.textContent = `Multiplication: ${a * b}`; break;
            case 'divide':
                arithmeticOutput.textContent = b === 0 ? 'Error: Division by zero!' : `Division: ${(a / b).toFixed(2)}`;
                break;
        }
    });
});
</script></body>
</html>
