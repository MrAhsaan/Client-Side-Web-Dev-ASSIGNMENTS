<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Task 9 - Student Registration Form</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/><style>/* Shared responsive defaults for a clean, accessible lab submission. */
:root {
    color-scheme: light;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.55;
    color: #172033;
    background: #f8fafc;
}
* { box-sizing: border-box; }
body {
    margin: clamp(1rem, 3vw, 2rem) auto;
    padding: 0 clamp(.25rem, 1vw, .75rem);
    max-width: 1100px;
    background: #f8fafc;
}
h1, h2, h3, h4 { line-height: 1.25; color: #14213d; }
h1 { margin-block: .5em .75em; }
h2 { margin-block: .75em; }
p { max-width: 78ch; }
a { color: #1557a6; }
a:hover { text-decoration-thickness: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, textarea:focus-visible {
    outline: 3px solid #93c5fd;
    outline-offset: 2px;
}
table {
    width: auto;
    max-width: 100%;
    margin-block: 1rem;
    border-collapse: collapse;
    background: #fff;
}
th, td {
    padding: .55rem .75rem;
    border: 1px solid #94a3b8;
    vertical-align: middle;
}
th { background: #eaf1fb; font-weight: 650; }
caption { padding: .5rem; font-weight: 650; text-align: left; }
img, video, iframe, canvas { max-width: 100%; }
img { height: auto; }
input, select, textarea, button { max-width: 100%; font: inherit; }
input, select, textarea { padding: .35rem .5rem; }
button, input[type="submit"], input[type="reset"] {
    padding: .4rem .75rem;
    border: 1px solid #64748b;
    border-radius: .35rem;
    background: #eff6ff;
    color: #172033;
    cursor: pointer;
}
button:hover, input[type="submit"]:hover, input[type="reset"]:hover { background: #dbeafe; }
button:disabled { cursor: not-allowed; opacity: .6; }
fieldset { margin-block: .75rem; padding: .8rem; border: 1px solid #94a3b8; border-radius: .4rem; }
legend { padding-inline: .35rem; font-weight: 650; }
.q-box { background: #fff; }
.grid { display: flex; flex-wrap: wrap; gap: 12px; }
.card { border: 1px solid #cbd5e1; border-radius: .5rem; padding: 10px; width: 125px; background: #fff; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
    table { display: block; overflow-x: auto; white-space: nowrap; }
    iframe { width: 100%; }
}</style></head>
<body>
<h1>Student Registration Form</h1>
<form action="#" method="post">
<label for="sname">Full Name:</label><br/>
<input id="sname" name="sname" type="text"/><br/><br/>
<label for="spass">Password:</label><br/>
<input id="spass" name="spass" type="password"/><br/><br/>
<label>Gender:</label><br/>
<input id="male" name="gender" type="radio" value="Male"/>
<label for="male">Male</label>
<input id="female" name="gender" type="radio" value="Female"/>
<label for="female">Female</label><br/><br/>
<label>Skills:</label><br/>
<input id="html" name="skills" type="checkbox" value="HTML"/>
<label for="html">HTML</label>
<input id="js" name="skills" type="checkbox" value="JavaScript"/>
<label for="js">JavaScript</label><br/><br/>
<label for="course">Select Course:</label><br/>
<select id="course" name="course">
<option value="MCA">MCA</option>
<option value="MBA">MBA</option>
<option value="BCA">BCA</option>
</select><br/><br/>
<label for="photo">Upload Photo:</label><br/>
<input id="photo" name="photo" type="file"/><br/><br/>
<label for="address">Address:</label><br/>
<textarea cols="35" id="address" name="address" rows="4"></textarea><br/><br/>
<input type="submit" value="Register"/>
<input type="reset" value="Clear Form"/>
</form>
</body>
</html>
